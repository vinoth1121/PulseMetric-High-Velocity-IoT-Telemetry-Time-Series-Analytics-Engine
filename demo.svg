<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" width="100%" height="100%">
  <defs>
    <!-- Paper Grid Background -->
    <pattern id="millimeterGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(0,0,0,0.06)" stroke-width="1" />
      <path d="M 100 0 L 0 0 0 100" fill="none" stroke="rgba(0,0,0,0.12)" stroke-width="1.5" />
    </pattern>
    <style>
      .mono { font-family: 'IBM Plex Mono', monospace, monospace; }
      .heading { font-family: 'Barlow Condensed', sans-serif, sans-serif; font-weight: bold; }
      @keyframes traceMove {
        0% { stroke-dashoffset: 800; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes pulseAlert {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.4; }
      }
      .trace-line {
        stroke-dasharray: 800;
        stroke-dashoffset: 0;
        animation: traceMove 8s linear infinite;
      }
      .alert-pulse {
        animation: pulseAlert 1.5s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- Thermal Paper Base Background -->
  <rect width="880" height="440" fill="#F3EFE4" />
  <rect width="880" height="440" fill="url(#millimeterGrid)" />

  <!-- Outer Border & Header -->
  <rect x="15" y="15" width="850" height="410" fill="#FAF8F2" stroke="#D6D0C0" stroke-width="2" />
  <rect x="15" y="15" width="850" height="46" fill="#EAE5D8" stroke="#D6D0C0" stroke-width="1" />

  <!-- Title & Badges -->
  <circle cx="36" cy="38" r="6" fill="#10B981" />
  <text x="52" y="44" class="heading" font-size="20" fill="#181716" letter-spacing="1">PULSEMETRIC // THERMAL STRIP-CHART RECORDER</text>
  
  <rect x="520" y="27" width="165" height="22" fill="#DCFCE7" stroke="#15803D" stroke-width="1.5" />
  <text x="530" y="43" class="mono" font-size="11" font-weight="bold" fill="#15803D">ROUTER: TIER 2 (5-MIN)</text>

  <rect x="700" y="27" width="150" height="22" fill="#FEE2E2" stroke="#D92525" stroke-width="1.5" />
  <text x="710" y="43" class="mono" font-size="11" font-weight="bold" fill="#D92525">DOCS SCANNED: 6,601</text>

  <!-- Device Calibration Header -->
  <rect x="35" y="75" width="810" height="34" fill="#EAE5D8" stroke="#D6D0C0" stroke-width="1" />
  <text x="48" y="97" class="mono" font-size="12" fill="#5C5852">CHANNEL: <tspan fill="#181716" font-weight="bold">pm-device-001</tspan> [temperature_c] • DUAL-LANE: <tspan fill="#10B981">HOT 709 r/s</tspan> | <tspan fill="#3B82F6">COLD 18.9x DENSE</tspan></text>

  <!-- Chart Grid Area -->
  <rect x="60" y="125" width="760" height="230" fill="#F3EFE4" stroke="#A8A090" stroke-width="1" />
  
  <!-- Y-Axis Labels -->
  <text x="50" y="145" class="mono" font-size="10" fill="#5C5852" text-anchor="end">35.0°C</text>
  <text x="50" y="200" class="mono" font-size="10" fill="#5C5852" text-anchor="end">28.0°C</text>
  <text x="50" y="255" class="mono" font-size="10" fill="#5C5852" text-anchor="end">22.0°C</text>
  <text x="50" y="310" class="mono" font-size="10" fill="#5C5852" text-anchor="end">18.0°C</text>
  <text x="50" y="355" class="mono" font-size="10" fill="#5C5852" text-anchor="end">12.0°C</text>

  <!-- Grid lines inside chart -->
  <line x1="60" y1="140" x2="820" y2="140" stroke="rgba(0,0,0,0.08)" stroke-width="1" />
  <line x1="60" y1="195" x2="820" y2="195" stroke="rgba(0,0,0,0.08)" stroke-width="1" />
  <line x1="60" y1="250" x2="820" y2="250" stroke="rgba(0,0,0,0.08)" stroke-width="1" />
  <line x1="60" y1="305" x2="820" y2="305" stroke="rgba(0,0,0,0.08)" stroke-width="1" />

  <!-- 3-Sigma Confidence Band -->
  <path d="M 60 230 Q 180 210, 300 240 T 540 230 T 700 240 L 820 235 L 820 275 L 700 280 T 540 270 T 300 280 Q 180 250, 60 270 Z" fill="rgba(43, 108, 176, 0.08)" />

  <!-- Rolling EMA Line (Dashed Blue) -->
  <path d="M 60 250 Q 180 235, 300 260 T 540 250 T 700 260 L 820 255" fill="none" stroke="#2B6CB0" stroke-width="1.5" stroke-dasharray="3,3" />

  <!-- Gap-filled Synthetic segment (Brown Dash) -->
  <line x1="420" y1="255" x2="480" y2="253" stroke="#9B7A38" stroke-width="2.5" stroke-dasharray="4,4" />
  <text x="450" y="245" class="mono" font-size="9" fill="#9B7A38" text-anchor="middle">GAP-FILLED ($fill)</text>

  <!-- Primary Temperature Trace Line (Black) -->
  <path class="trace-line" d="M 60 255 L 120 252 L 180 248 L 240 258 L 300 251 L 340 152 L 380 254 L 420 255 M 480 253 L 540 250 L 600 256 L 660 249 L 720 258 L 780 252 L 820 250" fill="none" stroke="#121210" stroke-width="2.2" />

  <!-- Anomaly Stamped Diamond & Label -->
  <circle cx="340" cy="152" r="7" fill="#D92525" stroke="#FFFFFF" stroke-width="2" class="alert-pulse" />
  <rect x="305" y="125" width="70" height="18" fill="#FEE2E2" stroke="#D92525" stroke-width="1" />
  <text x="340" y="138" class="mono" font-size="9" font-weight="bold" fill="#D92525" text-anchor="middle">! 34.8°C (Z=8.4)</text>

  <!-- Footer Ticker Info -->
  <rect x="35" y="370" width="810" height="38" fill="#FEE2E2" stroke="#D92525" stroke-width="1" />
  <text x="48" y="394" class="mono" font-size="11" fill="#D92525" font-weight="bold">🚨 SSE ALARM STREAM: [17:54:12] dev-010 spike: value=34.8°C μ=22.1°C σ=1.51 Z=8.41 &gt; 3.0 (Merged into alerts)</text>
</svg>
